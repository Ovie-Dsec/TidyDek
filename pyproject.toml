[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tidydek"
description = "TidyDek: desktop workspace tidier (headless core first)"
authors = [{ name = "TidyDek Team" }]
dynamic = ["version"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "customtkinter==5.2.2",
    "pathspec==0.12.1",
    "PyYAML==6.0.2",
    "pydantic==2.9.2",
    "tomli==2.0.2 ; python_version < '3.11'",
    "tomli-w==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pillow==10.4.0",
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.dynamic]
version = {attr = "src.version.VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
